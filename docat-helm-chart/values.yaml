image:
  repository: ghcr.io/docat-org/docat
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Extra environment variables for the Docat container
env: []
  # - name: MAX_UPLOAD_SIZE
  #   value: 500M

# Extra environment variables from ConfigMaps or Secrets
envFrom: []
  # - configMapRef:
  #     name: docat-env

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  # When disabled, docs are stored in an emptyDir and lost when the pod restarts
  enabled: true
  # Use an existing PersistentVolumeClaim instead of creating one
  existingClaim: ""
  # Empty uses the cluster default StorageClass, "-" disables dynamic provisioning
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}
